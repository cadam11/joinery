appId: ca.adam11.joinery
productName: Joinery
copyright: Copyright © 2026 Craig Adam

# Directories
directories:
  output: release
  buildResources: resources

# Main entry point
extends: null

# Files to include in asar
files:
  - packages/main/dist/**/*
  - packages/main/package.json
  - packages/preload/dist/**/*
  - packages/preload/package.json
  - packages/renderer/dist/browser/**/*
  - packages/shared/dist/**/*
  - packages/shared/package.json
  - package.json
  - node_modules/**/*
  # Map workspace package to node_modules location
  - from: packages/shared
    to: node_modules/@joinery/shared
    filter:
      - dist/**/*
      - package.json
  # Exclusions
  - "!node_modules/.cache"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/.bin"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
  - "!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}"
  - "!**/{appveyor.yml,.travis.yml,circle.yml}"
  - "!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}"
  - "!**/node_modules/cpu-features/**"
  # Build-time toolchain. `nodeLinker: hoisted` puts every devDependency in the
  # root node_modules, which the `node_modules/**/*` line above collects, so each
  # of these ships in the asar unless it is named here. The four Angular entries
  # (@angular-devkit, @angular/cli, karma*, jasmine*) were swapped for their Vite
  # equivalents at Task 24.
  - "!**/node_modules/typescript/**"
  - "!**/node_modules/vite/**"
  - "!**/node_modules/rolldown/**"
  - "!**/node_modules/@vitejs/**"
  - "!**/node_modules/tailwindcss/**"
  - "!**/node_modules/@tailwindcss/**"

# Extra resources (outside asar)
extraResources:
  - from: resources/
    to: resources/
    filter:
      - "**/*"
      - "!*.plist"

# macOS configuration
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  # Joinery has no Apple Developer Program membership, so there is no Developer ID certificate to
  # sign with. `null` is app-builder-lib's documented "skip signing entirely" (its scheme.json
  # entry for mac.identity); leaving the key unset instead means "search the keychain", which
  # makes the build's behaviour depend on whatever certificates happen to be installed on the
  # machine running it.
  #
  # This also settles notarization: MacPackager.sign() returns at handleNullIdentity() before it
  # would reach notarizeIfProvided(), so nothing can attempt or fake a notarized build.
  #
  # hardenedRuntime and the entitlements below are inert while identity is null — they are only
  # applied by the signing step. They are kept rather than deleted because they are the correct
  # configuration on the day a certificate exists. See plans/release/DISTRIBUTION.md.
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  darkModeSupport: true
  extendInfo:
    NSRequiresAquaSystemAppearance: false

# DMG options
dmg:
  artifactName: "${productName}-${version}-${arch}.dmg"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

# Windows configuration
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: resources/icon.png

# NSIS installer options
nsis:
  artifactName: "${productName}-${version}-${arch}-setup.exe"
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

# Don't publish to any providers
publish: null

# Rebuild native modules (beforeBuild removes cpu-features which is incompatible)
npmRebuild: true
nodeGypRebuild: false
beforeBuild: scripts/before-build.js

# Use asar archive
asar: true
asarUnpack:
  - "**/*.node"
  - "**/keytar/**/*"
