packages:
  - 'packages/*'

# A flat, npm-identical node_modules with no symlinks inside dependency trees.
# Required because electron-builder collects the app's production dependency
# tree from disk: under pnpm's default isolated layout it silently omitted
# transitive packages (pg-protocol, pg-pool, denque, ...), producing an app.asar
# that packaged and signed cleanly but crashed on the first database connection.
# asar also cannot follow symlinks — see scripts/workspace-links.js.
#
# J-27 re-measured that against electron-builder 26.15.3 + pnpm 11.21.0 and the
# omission no longer reproduces: with `nodeLinker: isolated`, `pnpm run package:dir`
# exits 0, `pnpm run verify:package` loads all 13 modules from inside the archive,
# `pnpm run smoke:package` boots the bundle, and the archive's package set is a
# strict SUPERSET of the hoisted one (+abort-controller, buildcheck, color-convert,
# color-name, event-target-shim, events, process; nothing missing, 80 MB either way).
# The flip did NOT ship with J-27 because two proofs were unavailable: the packaged
# smoke tier (J-88), which needs a Docker engine that could not start containers that
# day, and the Windows leg of the release build, which no PR-time CI job exercises.
# What J-27 did land is the prerequisite — every import declared where it is made,
# including the three root ones the isolated layout exposed (@electron/asar,
# @types/node, @types/mssql) — so the flip is now a one-line change plus that proof.
#
# NOTE: pnpm 11 reads these settings ONLY from this file. The same keys in
# .npmrc are silently ignored (`pnpm config get node-linker` -> undefined).
nodeLinker: hoisted

# The Electron toolchain and several React ecosystem packages carry loose peer
# ranges that are warnings rather than real conflicts; failing the install on
# them blocks CI for no gain.
strictPeerDependencies: false

# Moved from package.json "overrides" during the npm -> pnpm migration.
# @types/node is pinned to 20.x to match .nvmrc / CI.
#
# `typescript: ~5.4.5` used to sit here too, pinned to the version the Angular 18
# toolchain supported. Task 24 deleted that toolchain and dropped the override.
# The version each package DECLARES is still ~5.4.5 (and .syncpackrc pins it), so
# nothing moved in this PR — bumping it is a follow-up with its own verification,
# and packages/renderer/tsconfig.json's `exclude: ["vite.config.ts"]` is waiting
# on it.
overrides:
  '@types/node': ^20.14.2

# pnpm does not run dependency lifecycle scripts unless they are listed here.
# Anything not listed stays blocked, so new install scripts arriving via a
# transitive bump fail loudly instead of running silently.
allowBuilds:
  # Downloads the Electron binary — the app cannot run without it.
  electron: true
  # Native modules we actually load at runtime.
  keytar: true
  ssh2: true
  # esbuild links its platform binary; the preload bundle step needs it.
  esbuild: true
  # Squirrel.Windows installer support, reached transitively through
  # electron-builder. Kept enabled so Windows release builds match npm.
  electron-winstaller: true
  # Optional ssh2 accelerator that is incompatible with Electron's V8.
  # scripts/before-build.js deletes it before @electron/rebuild runs and
  # electron-builder.yml excludes it from the asar, so building it is wasted
  # work. ssh2 require()s it in a try/catch and degrades cleanly.
  cpu-features: false
  # Reached transitively through @grpc/proto-loader. It was previously listed with
  # the Angular CLI accelerators (lmdb, msgpackr-extract, nice-napi) and its comment
  # said so, which was wrong: those three left the tree with Angular at Task 24 and
  # this one did not. Its postinstall generates the package's CommonJS/ESM shims.
  protobufjs: true
