# This file exists to make `docs-site/` its own pnpm root, and that is its whole job.
#
# plans/docs-site/PROPOSAL.md §2.3 places the docs site OUTSIDE the app's pnpm workspace so
# that turbo, `pnpm run package`, `verify:package` and CI's `packages/**` path filter never
# see it. Declaring the directory is not enough on its own: pnpm resolves a workspace by
# walking UP from the current directory until it finds a `pnpm-workspace.yaml`, so a bare
# `pnpm install` run in here finds the repo root's file instead and installs the whole app
# workspace — 1,300 packages hoisted into the root `node_modules`, which is precisely the
# blast radius §2.3 exists to avoid.
#
# An empty `packages` list stops that walk. `docs-site/` is then a single-project root with
# its own `pnpm-lock.yaml` and its own `node_modules`, and `pnpm install` behaves identically
# whether it is run from here or from a clone of this directory alone.
packages: []

# pnpm does not run dependency lifecycle scripts unless they are listed here, so a new
# install script arriving through a transitive bump fails loudly instead of running
# silently. Same policy as the app's root workspace file.
allowBuilds:
  # esbuild links its platform binary; Vite (and therefore `astro build`) needs it.
  esbuild: true

# satteri 0.10.4 is a partial release: `@bruits/satteri-darwin-arm64` and
# `@bruits/satteri-linux-x64-musl` were never published at that version (the registry jumps
# 0.10.3 -> 0.10.5 for both), while satteri's own package.json still lists them as optional
# dependencies. pnpm therefore installs satteri 0.10.4 on Apple Silicon with NO binding of its
# own, and the NAPI loader's `require('@bruits/satteri-darwin-arm64')` resolves through pnpm's
# hoisted fallback to the 0.9.5 binding that `@astrojs/starlight` brought in for its own
# satteri copy. The version guard that would have caught that is inert unless
# NAPI_RS_ENFORCE_VERSION_CHECK is set, so the mismatch is silent: 0.10.4's JS drives a 0.9.5
# native parser, container directives never fire, and every `:::note` ships to the page as
# literal ":::note" body text (J-103).
#
# `@astrojs/markdown-satteri@0.3.7` asks for `^0.10.3`, so pinning that range to 0.10.5 — the
# next release, and one that DOES publish all nine bindings — gives Apple Silicon a matching
# binary. Linux x64 glibc, which is what the Pages workflow runs, had a valid 0.10.4 binding
# and was never affected; 0.10.5 is a same-minor bump there.
#
# `scripts/check-markdown-directives.mjs` fails the build if this ever regresses. Drop the
# override once `@astrojs/markdown-satteri` resolves a satteri version whose bindings are
# complete on their own.
overrides:
  'satteri@^0.10.3': 0.10.5
