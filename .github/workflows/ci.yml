name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/**'
      - 'tests/**'
      # Build scripts. scripts/release/*.ts has unit tests and is type-checked by
      # tsconfig.tests.json, and neither ran on a pull request that touched only this
      # directory until it was named here.
      - 'scripts/**'
      # The packaging config, because `scripts/release/asar-inventory.spec.ts` asserts about THIS
      # file — that every `excluded-by-config` rule still has a live exclusion line in it. Without
      # it named here, a pull request editing only this file ran no CI and that guard never fired,
      # which is the same gap `scripts/**` above was added to close (J-90 review, finding 1).
      - 'electron-builder.yml'
      - 'vitest.config.ts'
      - 'tsconfig.tests.json'
      - 'playwright.config.ts'
      # The two files that define the lint gate itself. `turbo.json` declares every task CI
      # runs (including `lint` and its cache inputs) and `.eslintrc.json` decides what lint
      # MEANS for main, preload and shared — yet a pull request touching only one of them
      # matched nothing above and ran no CI, so the gate could be weakened or disabled by a
      # change that was never gated. Same hole `scripts/**` and `electron-builder.yml` were
      # added to close (J-34).
      - 'turbo.json'
      - '.eslintrc.json'
      # This file, so a change to CI runs the CI it changed — without it a pull request that
      # only edits a job (or adds one, as `docs-reference-drift` below was) never runs it, and
      # the first proof it works arrives after merge.
      - '.github/workflows/ci.yml'
  push:
    branches: [main]

jobs:
  test:
    name: Type-check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reads the version from the root package.json "packageManager" field.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @joinery/shared exec tsc --build

      # Same reason as the step above: dist/ is gitignored, so on a clean checkout there
      # are no declarations to type-check against. packages/renderer imports
      # `JoineryAPI` from @joinery/preload, which resolves via the package's
      # "types": "dist/index.d.ts" — absent here until something emits it. The
      # "Type-check preload" step below cannot serve: it is --noEmit, and it runs after.
      # Must follow the shared build, because preload's declaration emit is a composite
      # project referencing packages/shared.
      - name: Build preload package
        run: pnpm --filter @joinery/preload run build

      - name: Type-check main
        run: pnpm exec tsc --noEmit -p packages/main/tsconfig.json

      - name: Type-check renderer
        run: pnpm exec tsc --noEmit -p packages/renderer/tsconfig.json

      - name: Type-check preload
        run: pnpm exec tsc --noEmit -p packages/preload/tsconfig.json

      - name: Type-check tests
        run: pnpm run typecheck:tests

      # Every package, not just the renderer. `main`, `shared` and `preload` had no `lint` script
      # at all until J-128, so turbo had nothing to run for them and CI linted one package out of
      # four — while type-checking all four. The pre-commit hook did lint them, which is why the
      # gap stayed invisible: it only opened on a branch that reached CI without passing the hook.
      - name: Lint every package
        run: pnpm run lint

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # The other half of the docs staleness guard.
  #
  # `docs-site/scripts/generate-reference.mjs --check` fails when the committed reference pages no
  # longer match `packages/renderer/src/commands/catalogue.ts` or
  # `packages/shared/src/config/ai-vendors.json`. `.github/workflows/docs.yml` runs it for changes
  # under `docs-site/` and for changes to those two inputs; this job runs it for every CI trigger,
  # so a renderer change that also touches something else still cannot merge with a stale table.
  #
  # A separate job rather than a step in `test` above, for one reason: `docs-site/` is outside the
  # app's pnpm workspace, with its own lockfile, its own `pnpm-workspace.yaml` and its own
  # `packageManager` — installing it inside the app job would need a second pnpm setup and a second
  # cache path in a job whose `node_modules` is the app's. Kept parallel and cheap: no app install,
  # no build, one script.
  docs-reference-drift:
    name: Docs reference drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the version from docs-site/package.json, NOT the root manifest.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: docs-site/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Astro 7 requires >= 22.12, and docs-site/package.json says so in `engines`.
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Install docs dependencies
        run: pnpm install --frozen-lockfile
        working-directory: docs-site

      # The generator formats what it emits with Prettier, so this needs the install above; it
      # does NOT need Astro to run, and deliberately does not build the site — docs.yml owns that.
      - name: Check the generated reference pages against the app
        run: pnpm run check:reference
        working-directory: docs-site
