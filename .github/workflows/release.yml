# The whole of Joinery's distribution. Design and rationale: plans/release/DISTRIBUTION.md
# What a human does around it: plans/release/CRAIG-RELEASE-STEPS.md
#
# A release is a tag and a tag is a release: there is no workflow_dispatch, no branch trigger,
# and no manual asset upload, so there is exactly one thing to audit after the fact.
#
# Replaces build-release.yml, which had every matrix leg upload to the release itself. Two legs
# racing to create the same release is a real failure mode, and neither could see the other's
# files, so no checksum manifest covering the whole release was expressible. One publisher now.
#
# There is exactly one secret in this workflow: HOMEBREW_TAP_TOKEN. Joinery has no Apple
# Developer Program membership, so there is no signing path, no notarization, and no conditional
# on either — the macOS builds are unsigned and every place that mentions them says so.

name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege, workflow-wide default. Only the job that creates the GitHub Release is
# raised to `contents: write`; every other job re-declares `contents: read` so that adding a
# job cannot silently inherit write access to the repository.
permissions:
  contents: read

# Never cancel a release in flight. A half-published release is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAP_REPOSITORY: cadam11/homebrew-joinery

jobs:
  # Cheap checks that must fail in a minute rather than after two forty-minute builds.
  guard:
    name: Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: The tag and the manifest must agree
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$version" != "$manifest" ]; then
            echo "::error title=Tag does not match package.json::Tag ${GITHUB_REF_NAME} means version ${version}, but package.json says ${manifest}. electron-builder names every artifact after the manifest, so every Homebrew cask URL would 404. Bump package.json, merge it, and re-tag."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}." >> "$GITHUB_STEP_SUMMARY"

      # The tap token is not *used* until the last job, which runs after the GitHub Release is
      # already public and permanent. Proving what can be proved here costs two API calls and
      # turns "the release shipped but nobody can brew upgrade into it" into "the release never
      # started".
      #
      # Be precise about what each check proves, because the tap is a PUBLIC repository and a
      # fine-grained token "always include[s] read-only access to all public repositories on
      # GitHub" (GitHub Docs, "Managing your personal access tokens"). So reading the tap proves
      # the secret is set and the credential is live and unexpired — it does NOT prove the token
      # is scoped to the tap, and it does NOT prove it can write.
      #
      # `.permissions.push` is the only write signal in that response. It is reliable enough to
      # fail on when it comes back false, but GitHub does not document it as a guarantee for
      # fine-grained tokens, so an absent or null field warns rather than blocking a release that
      # is probably fine. A wrongly-scoped token that slips past both checks fails in `homebrew`,
      # which is re-runnable on its own once the token is replaced.
      - name: The Homebrew tap must exist and the token must reach it
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=HOMEBREW_TAP_TOKEN is not set::Add a fine-grained personal access token with Contents: Read and write on ${TAP_REPOSITORY}, and nothing else, as the repository secret HOMEBREW_TAP_TOKEN. See plans/release/CRAIG-RELEASE-STEPS.md."
            exit 1
          fi
          if ! gh api "repos/${TAP_REPOSITORY}" --jq .full_name; then
            echo "::error title=The tap is not reachable::HOMEBREW_TAP_TOKEN is set, but it could not read ${TAP_REPOSITORY}. The token is expired or revoked, or the tap has been renamed or deleted."
            exit 1
          fi
          writable="$(gh api "repos/${TAP_REPOSITORY}" --jq 'if .permissions == null then "unknown" else (.permissions.push | tostring) end')"
          case "$writable" in
            true)
              echo "HOMEBREW_TAP_TOKEN can write to ${TAP_REPOSITORY}."
              ;;
            false)
              echo "::error title=The tap token cannot write::HOMEBREW_TAP_TOKEN can read ${TAP_REPOSITORY} — every token can, it is public — but it has no write access, so the tap update at the end of this release would fail. Re-create it scoped to ${TAP_REPOSITORY} with Contents: Read and write. See plans/release/CRAIG-RELEASE-STEPS.md."
              exit 1
              ;;
            *)
              echo "::warning title=Tap write access unverified::GitHub did not report a permissions object for ${TAP_REPOSITORY}, so this run could not confirm HOMEBREW_TAP_TOKEN can write to it. If the homebrew job fails at the end, that is the reason."
              ;;
          esac

      # Runs the real rewriter against a throwaway copy of the real template, so a cask that
      # update-cask.ts can no longer rewrite fails here rather than after the release is public
      # and the tap is the only thing left to update.
      - name: The cask template must still be rewritable
        run: |
          set -euo pipefail
          fake="$(printf 'f%.0s' $(seq 1 64))"
          cp Casks/joinery.rb "$RUNNER_TEMP/joinery.rb"
          node scripts/release/update-cask.ts \
            --cask "$RUNNER_TEMP/joinery.rb" \
            --version "${{ steps.version.outputs.version }}" \
            --sha256-arm64 "$fake" \
            --sha256-x64 "$fake"

  build:
    name: Build ${{ matrix.platform }}
    needs: guard
    runs-on: ${{ matrix.os }}
    # The mac leg takes under 4 minutes and the Windows leg under 10. The v1.0.0 run spent 87 of
    # its 90 minutes inside a hung electron-builder dependency walk (J-220); a hang should fail
    # the release in minutes, not hours.
    timeout-minutes: 30
    # Reads the repository and nothing else. This job runs third-party install and build
    # scripts (pnpm postinstall, node-gyp, electron-builder), so it must never hold a token
    # that can write to the repository.
    permissions:
      contents: read

    strategy:
      # A release with only half its installers is not a release worth publishing.
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            platform: mac
            args: --mac
          - os: windows-latest
            platform: win
            args: --win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the version from the root package.json "packageManager" field.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 24, not the 20 the old workflow pinned: scripts/release/*.ts runs under Node's type
      # stripping, which needs >= 22.18, and CI's test job is already on 24.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      # scripts/package.js does the workspace symlink swap, runs electron-builder, and ALWAYS
      # restores the symlinks — doing those as separate steps leaves node_modules in the swapped
      # state when the build fails.
      #
      # No signing secrets and no CSC_* / APPLE_* environment: `mac.identity: null` in
      # electron-builder.yml is the single place that decides Joinery is not code-signed, and it
      # decides it for a developer's local build exactly as it does here.
      - name: Build the Electron app
        shell: bash
        run: node scripts/package.js ${{ matrix.args }}

      # Two checks, chained inside the script. `verify-package.js` extracts the asar and
      # require()s each module the main process depends on — the class of bug where packaging exits
      # 0 and the shipped app crashes on first connect. `asar-inventory.ts --check` then fails if a
      # build-time or known-dead package is inside the archive (J-90): the built archive is the
      # only place that can be seen, so it is checked here rather than asserted in config.
      - name: Acceptance-check the packaged app
        if: matrix.platform == 'mac'
        run: pnpm run verify:package

      # Not a gate — a record. Every release is unsigned, so there is nothing here that could
      # pass or fail; what this does is put the actual signature state of the shipped bundle in
      # the run summary, where a future change that accidentally starts signing would show up.
      - name: Record the build's signature state
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -uo pipefail
          echo '::warning title=Unsigned build::Joinery is not code-signed and not notarized. macOS quarantines every download, including through Homebrew, and the first launch needs System Settings > Privacy & Security > Open Anyway. The release notes say so.'
          echo '**macOS: not signed, not notarized.**' >> "$GITHUB_STEP_SUMMARY"
          if codesign -dv release/mac-arm64/Joinery.app 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo 'The above is whatever signature the Electron binary arrived with from its own linker. No identity was applied by this build.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'codesign reports no signature at all, which is an expected state for an unsigned build.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the GitHub Release
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job that writes. `gh release create` needs it; nothing else here does.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}

    steps:
      - name: Collect every installer into one directory
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installers-*
          merge-multiple: true

      - name: Checksum everything that is about to be published
        run: |
          set -euo pipefail
          cd artifacts
          # The two names the Homebrew cask builds its URLs from. If electron-builder ever
          # renames them, the tap breaks silently a job later; break loudly here instead.
          for required in "Joinery-${VERSION}-arm64.dmg" "Joinery-${VERSION}-x64.dmg"; do
            if [ ! -f "$required" ]; then
              echo "::error title=Missing installer::${required} is not among the build artifacts, and the Homebrew cask's download URL is built from that exact name."
              exit 1
            fi
          done
          shopt -s nullglob
          files=(*)
          # Written outside the directory first so the manifest cannot list itself.
          sha256sum "${files[@]}" > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      # Every release is unsigned, so there is one set of notes rather than a branch. The
      # first-launch instructions are the ones that work on macOS Sequoia and later, where
      # Apple removed the Control-click override: developer.apple.com/news/?id=saqachfa.
      - name: Write the release notes
        run: |
          set -euo pipefail
          {
            echo '## Install'
            echo
            echo '### macOS — Homebrew'
            echo
            echo '```bash'
            echo 'brew install --cask cadam11/joinery/joinery'
            echo '```'
            echo
            echo '### macOS — direct download'
            echo
            echo "Apple Silicon: \`Joinery-${VERSION}-arm64.dmg\` · Intel: \`Joinery-${VERSION}-x64.dmg\`"
            echo
            echo '### Windows'
            echo
            echo "\`Joinery-${VERSION}-x64-setup.exe\` or \`Joinery-${VERSION}-arm64-setup.exe\`. Windows builds are not code-signed, so SmartScreen will warn: More info, then Run anyway."
            echo
            echo '## First launch on macOS'
            echo
            echo 'Joinery is **not code-signed and not notarized** — there is no Apple Developer Program membership behind it. macOS quarantines it either way you install it, Homebrew included, and refuses the first launch.'
            echo
            echo 'Open it, and macOS remembers until the app is replaced:'
            echo
            echo '1. Double-click Joinery. macOS refuses, and says so.'
            echo '2. Open **System Settings → Privacy & Security**, scroll to **Security**, and click **Open Anyway** beside the message about Joinery.'
            echo '3. Confirm, and authenticate. Every launch after this one is normal.'
            echo
            echo 'A `brew upgrade` replaces the bundle, and Homebrew can only carry your approval forward when it can verify the new app has the same signer as the old one. An unsigned app has none, so expect the same three steps after each upgrade.'
            echo
            echo 'On macOS Sonoma and earlier, Control-click the app in Finder and choose **Open** instead. That shortcut was removed in macOS Sequoia.'
            echo
            echo 'Or, in a terminal, drop the quarantine flag yourself before the first launch:'
            echo
            echo '```bash'
            echo 'xattr -dr com.apple.quarantine "/Applications/Joinery.app"'
            echo '```'
            echo
            echo '`-r` is not optional: Homebrew sets the flag on every file inside the bundle, not just the bundle itself.'
            echo
            echo '## Verifying a download'
            echo
            echo '`SHA256SUMS.txt` covers every file in this release.'
            echo
            echo '```bash'
            echo "shasum -a 256 -c SHA256SUMS.txt --ignore-missing"
            echo '```'
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Joinery ${VERSION}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            artifacts/*

  homebrew:
    name: Update the Homebrew tap
    needs: [guard, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reads this repo and the release it just published. The cross-repository push to the
    # tap is authenticated by HOMEBREW_TAP_TOKEN, not by GITHUB_TOKEN.
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}

    steps:
      # No token check here: `guard` already proved HOMEBREW_TAP_TOKEN can read the tap, and it
      # did so before anything was published. If the checkout below fails anyway, the token was
      # revoked mid-release, and this job is safely re-runnable once it is replaced.
      - name: Checkout Joinery
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Checkout the tap
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Take the checksums from the release we just published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir .
          for arch in arm64 x64; do
            sum="$(awk -v want="Joinery-${VERSION}-${arch}.dmg" '$2 == want { print $1 }' SHA256SUMS.txt)"
            if [ -z "$sum" ]; then
              echo "::error title=Checksum not found::SHA256SUMS.txt has no line for Joinery-${VERSION}-${arch}.dmg."
              exit 1
            fi
            echo "SHA_${arch}=${sum}" >> "$GITHUB_ENV"
          done

      # This repo's Casks/joinery.rb is the template and the single source of truth; the tap's
      # copy is an output. Editing the cask means editing it here. The same goes for the tap's
      # README: Casks/TAP_README.md is the source, and it is copied on every release because the
      # v1.0.0 tap still carried a pre-release README telling users to right-click → Open, which
      # macOS Sequoia no longer honours.
      - name: Stamp the cask and push it
        run: |
          set -euo pipefail
          mkdir -p tap/Casks
          cp Casks/joinery.rb tap/Casks/joinery.rb
          cp Casks/TAP_README.md tap/README.md
          node scripts/release/update-cask.ts \
            --cask tap/Casks/joinery.rb \
            --version "$VERSION" \
            --sha256-arm64 "$SHA_arm64" \
            --sha256-x64 "$SHA_x64"
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/joinery.rb README.md
          if git diff --cached --quiet; then
            echo "The tap is already at ${VERSION}; nothing to push." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "joinery ${VERSION}"
          git push
          echo "Pushed joinery ${VERSION} to ${TAP_REPOSITORY}." >> "$GITHUB_STEP_SUMMARY"
